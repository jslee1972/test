name: TFDA connectivity test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test endpoints
        run: |
          mkdir -p results
          out=results/connectivity.txt
          echo "Runner IP: $(curl -s https://api.ipify.org)" > $out
          echo "Time: $(date -u +%FT%TZ)" >> $out
          urls=(
            "https://data.fda.gov.tw/swagger-ui/index.html"
            "https://data.fda.gov.tw/v3/api-docs"
            "https://data.fda.gov.tw/v2/api-docs"
            "https://data.fda.gov.tw/frontsite/data/DataAction.do?method=doDetail&infoId=37"
            "https://data.gov.tw/dataset/9123"
            "https://info.nhi.gov.tw/"
          )
          for u in "${urls[@]}"; do
            r=$(curl -sS -L -o /tmp/body -w '%{http_code} %{size_download}B %{time_total}s %{content_type}' \
                --max-time 60 -A "Mozilla/5.0 CareAlong-ConnTest" "$u" 2>&1) || r="FAIL $r"
            { echo "$r  <- $u"; head -c 300 /tmp/body | tr -d '\n'; echo; echo "---"; } >> $out
          done
          curl -sS -L --max-time 60 -o results/api-docs.json https://data.fda.gov.tw/v3/api-docs || true
          cat $out

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results
          git commit -m "Connectivity test results" || exit 0
          git push
